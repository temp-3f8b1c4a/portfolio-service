name: Install AI TrustBOM
description: Install the pinned trustbom npm package without install scripts and expose its launcher.
author: Spaverlock

outputs:
  launcher:
    description: Path to the installed trustbom launcher script; run it with node.
    value: ${{ steps.install.outputs.launcher }}

runs:
  using: composite
  steps:
    - name: Install AI TrustBOM
      id: install
      shell: bash
      env:
        TRUSTBOM_PINNED_VERSION: "1.0.0-dev.497"
      run: |
        set -euo pipefail
        version="${TRUSTBOM_ACTION_VERSION:-$TRUSTBOM_PINNED_VERSION}"
        pattern='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
        if ! [[ "$version" =~ $pattern ]]; then
          echo "::error::TRUSTBOM_ACTION_VERSION must be an exact package version such as 1.0.0."
          exit 1
        fi
        prefix="$RUNNER_TEMP/trustbom-$version"
        mkdir -p "$prefix"
        npm install --prefix "$prefix" --ignore-scripts --no-audit --no-fund --loglevel error "trustbom@$version"
        launcher="$prefix/node_modules/trustbom/bin/trustbom.js"
        echo "Installed trustbom $(node "$launcher" --version)"
        echo "launcher=$launcher" >> "$GITHUB_OUTPUT"
